[project]
name = "ml-flood-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lucalto", email = "lucalto@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fiona>=1.10.1",
    "geemap>=0.38.9",
    "geocube>=0.8.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyproj>=3.7.1,<3.8",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shapely>=2.2.0",
]

[project.scripts]
ml-flood-prediction = "ml_flood_prediction:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
